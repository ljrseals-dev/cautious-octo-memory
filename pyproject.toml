[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sprintprofile"
version = "0.1.0"
description = "Evidence-graded physical-property profiles for sprinters"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sprintprofile = "sprintprofile.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sprintprofile*"]
